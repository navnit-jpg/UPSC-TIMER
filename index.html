<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UPSC Timer">
<title>UPSC Timer</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='115' fill='%230f1117'/%3E%3Ccircle cx='256' cy='256' r='190' fill='none' stroke='%234a8ff7' stroke-width='14'/%3E%3Ccircle cx='256' cy='256' r='172' fill='none' stroke='%231e2332' stroke-width='4'/%3E%3Ccircle cx='256' cy='256' r='14' fill='%234a8ff7'/%3E%3Cline x1='256' y1='256' x2='256' y2='100' stroke='%23f0f2f7' stroke-width='12' stroke-linecap='round'/%3E%3Cline x1='256' y1='256' x2='336' y2='300' stroke='%234a8ff7' stroke-width='14' stroke-linecap='round'/%3E%3Ccircle cx='256' cy='66' r='10' fill='%234a8ff7'/%3E%3Ccircle cx='256' cy='446' r='10' fill='%234a8ff7'/%3E%3Ccircle cx='446' cy='256' r='10' fill='%234a8ff7'/%3E%3Ccircle cx='66' cy='256' r='10' fill='%234a8ff7'/%3E%3Ctext x='256' y='360' text-anchor='middle' font-family='monospace' font-size='72' font-weight='600' fill='%23f0f2f7' letter-spacing='4'%3EUPSC%3C/text%3E%3C/svg%3E">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='115' fill='%230f1117'/%3E%3Ccircle cx='256' cy='256' r='190' fill='none' stroke='%234a8ff7' stroke-width='14'/%3E%3Ccircle cx='256' cy='256' r='14' fill='%234a8ff7'/%3E%3Cline x1='256' y1='256' x2='256' y2='100' stroke='%23f0f2f7' stroke-width='12' stroke-linecap='round'/%3E%3Cline x1='256' y1='256' x2='336' y2='300' stroke='%234a8ff7' stroke-width='14' stroke-linecap='round'/%3E%3Ctext x='256' y='360' text-anchor='middle' font-family='monospace' font-size='72' font-weight='600' fill='%23f0f2f7' letter-spacing='4'%3EUPSC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #181c25;
    --surface2: #1e2332;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #f0f2f7;
    --muted: #7a82a0;
    --hint: #454d68;
    --accent-blue: #4a8ff7;
    --accent-green: #3ecf8e;
    --accent-amber: #f5a524;
    --accent-red: #e5534b;
    --phase1: #4a8ff7;
    --phase2: #3ecf8e;
    --phase3: #f5a524;
    --font-mono: 'DM Mono', monospace;
    --font-sans: 'DM Sans', sans-serif;
    --r-sm: 8px;
    --r-md: 12px;
    --r-lg: 16px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 0 2rem;
    -webkit-font-smoothing: antialiased;
  }

  header {
    width: 100%;
    max-width: 480px;
    padding: 1.25rem 1.5rem 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .app-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .settings-btn {
    background: var(--surface);
    border: 0.5px solid var(--border2);
    border-radius: var(--r-sm);
    color: var(--muted);
    font-size: 13px;
    font-family: var(--font-sans);
    padding: 6px 12px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .settings-btn:hover { background: var(--surface2); color: var(--text); }

  .main {
    width: 100%;
    max-width: 480px;
    padding: 1.5rem;
    flex: 1;
  }

  .preset-row {
    display: flex;
    gap: 8px;
    margin-bottom: 1.5rem;
  }

  .preset-btn {
    flex: 1;
    background: var(--surface);
    border: 0.5px solid var(--border2);
    border-radius: var(--r-md);
    color: var(--muted);
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 500;
    padding: 10px 8px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }
  .preset-btn:hover { background: var(--surface2); color: var(--text); }
  .preset-btn.active {
    background: var(--surface2);
    border-color: var(--accent-blue);
    color: var(--text);
  }
  .preset-btn .pb-marks {
    font-size: 11px;
    color: var(--hint);
    margin-top: 2px;
  }
  .preset-btn.active .pb-marks { color: var(--muted); }

  .timer-card {
    background: var(--surface);
    border: 0.5px solid var(--border2);
    border-radius: var(--r-lg);
    padding: 2rem 1.5rem 1.5rem;
    margin-bottom: 1rem;
    text-align: center;
  }

  .timer-display {
    font-family: var(--font-mono);
    font-size: 72px;
    font-weight: 400;
    letter-spacing: -2px;
    line-height: 1;
    margin-bottom: 0.5rem;
    transition: color 0.3s;
  }

  .phase-label {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 1.5rem;
    min-height: 18px;
    letter-spacing: 0.02em;
  }

  .progress-track {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 0.5rem;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.8s linear, background 0.4s;
  }

  .nudge-markers {
    display: flex;
    position: relative;
    height: 16px;
    margin-bottom: 1.25rem;
  }

  .nudge-mark {
    position: absolute;
    top: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    transform: translateX(-50%);
  }

  .nudge-mark-line {
    width: 1px;
    height: 6px;
    background: var(--hint);
  }

  .nudge-mark-label {
    font-size: 10px;
    color: var(--hint);
    margin-top: 1px;
    white-space: nowrap;
    font-family: var(--font-mono);
  }

  .nudge-mark.triggered .nudge-mark-line { background: var(--accent-amber); }
  .nudge-mark.triggered .nudge-mark-label { color: var(--accent-amber); }

  .phase-pills {
    display: flex;
    gap: 6px;
    margin-bottom: 1.5rem;
  }

  .phase-pill {
    flex: 1;
    background: var(--surface2);
    border: 0.5px solid var(--border);
    border-radius: var(--r-sm);
    padding: 8px 6px;
    text-align: center;
    transition: all 0.2s;
  }

  .phase-pill .pp-time {
    font-size: 11px;
    font-family: var(--font-mono);
    color: var(--hint);
    margin-bottom: 3px;
  }

  .phase-pill .pp-label {
    font-size: 11px;
    color: var(--hint);
    line-height: 1.3;
  }

  .phase-pill.active {
    border-color: var(--phase-color, var(--accent-blue));
    background: color-mix(in srgb, var(--phase-color, var(--accent-blue)) 10%, var(--surface2));
  }

  .phase-pill.active .pp-time { color: var(--phase-color, var(--accent-blue)); }
  .phase-pill.active .pp-label { color: var(--text); }
  .phase-pill.done .pp-label { text-decoration: line-through; }
  .phase-pill.done .pp-time { color: var(--hint); }

  .nudge-alert {
    background: var(--surface2);
    border: 0.5px solid var(--accent-amber);
    border-radius: var(--r-md);
    padding: 10px 14px;
    font-size: 13px;
    color: var(--accent-amber);
    margin-bottom: 1rem;
    text-align: center;
    display: none;
    animation: fadein 0.3s ease;
  }
  .nudge-alert.show { display: block; }
  .nudge-alert.done {
    border-color: var(--accent-green);
    color: var(--accent-green);
  }

  @keyframes fadein { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

  .controls {
    display: flex;
    gap: 10px;
  }

  .btn-primary {
    flex: 2;
    background: var(--accent-blue);
    border: none;
    border-radius: var(--r-md);
    color: #fff;
    font-family: var(--font-sans);
    font-size: 15px;
    font-weight: 500;
    padding: 14px;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn-primary:hover { opacity: 0.88; }
  .btn-primary:active { transform: scale(0.98); }

  .btn-secondary {
    flex: 1;
    background: var(--surface2);
    border: 0.5px solid var(--border2);
    border-radius: var(--r-md);
    color: var(--muted);
    font-family: var(--font-sans);
    font-size: 15px;
    font-weight: 400;
    padding: 14px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .btn-secondary:hover { background: var(--surface); color: var(--text); }

  .settings-panel {
    display: none;
    background: var(--surface);
    border: 0.5px solid var(--border2);
    border-radius: var(--r-lg);
    padding: 1.25rem 1.5rem;
    margin-bottom: 1rem;
    animation: fadein 0.2s ease;
  }
  .settings-panel.open { display: block; }

  .settings-panel h3 {
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 1rem;
  }

  .setting-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 0.75rem;
  }

  .setting-row label {
    font-size: 13px;
    color: var(--muted);
    min-width: 100px;
  }

  .setting-row input[type=number] {
    width: 64px;
    background: var(--surface2);
    border: 0.5px solid var(--border2);
    border-radius: var(--r-sm);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 14px;
    padding: 6px 10px;
    text-align: center;
  }

  .setting-row input[type=number]:focus {
    outline: none;
    border-color: var(--accent-blue);
  }

  .setting-row .unit {
    font-size: 12px;
    color: var(--hint);
  }

  .setting-row input[type=text] {
    flex: 1;
    background: var(--surface2);
    border: 0.5px solid var(--border2);
    border-radius: var(--r-sm);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 13px;
    padding: 6px 10px;
  }

  .setting-row input[type=text]:focus {
    outline: none;
    border-color: var(--accent-blue);
  }

  .apply-btn {
    width: 100%;
    margin-top: 0.5rem;
    background: var(--surface2);
    border: 0.5px solid var(--accent-blue);
    border-radius: var(--r-sm);
    color: var(--accent-blue);
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 500;
    padding: 8px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .apply-btn:hover { background: color-mix(in srgb, var(--accent-blue) 12%, var(--surface2)); }

  .divider {
    height: 0.5px;
    background: var(--border);
    margin: 0.75rem 0;
  }

  .install-section {
    background: var(--surface);
    border: 0.5px solid var(--border2);
    border-radius: var(--r-lg);
    padding: 1rem 1.25rem;
    margin-bottom: 1rem;
  }

  .install-section h3 {
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 0.75rem;
  }

  .install-steps {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .install-steps li {
    font-size: 13px;
    color: var(--muted);
    display: flex;
    gap: 8px;
    align-items: flex-start;
    line-height: 1.5;
  }

  .install-steps li .step-num {
    background: var(--surface2);
    border: 0.5px solid var(--border2);
    border-radius: 50%;
    width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-family: var(--font-mono);
    color: var(--muted);
    flex-shrink: 0;
    margin-top: 1px;
  }

  .os-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 0.75rem;
  }

  .os-tab {
    background: var(--surface2);
    border: 0.5px solid var(--border2);
    border-radius: var(--r-sm);
    color: var(--hint);
    font-family: var(--font-sans);
    font-size: 12px;
    padding: 4px 10px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .os-tab:hover { color: var(--muted); }
  .os-tab.active { border-color: var(--accent-blue); color: var(--accent-blue); background: color-mix(in srgb, var(--accent-blue) 10%, var(--surface2)); }

  .os-steps { display: none; }
  .os-steps.show { display: flex; flex-direction: column; gap: 6px; }

  @media (max-width: 380px) {
    .timer-display { font-size: 58px; }
    .main { padding: 1rem; }
  }
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:10px;">
    <svg width="32" height="32" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <rect width="512" height="512" rx="115" fill="#0f1117"/>
      <circle cx="256" cy="256" r="190" fill="none" stroke="#4a8ff7" stroke-width="14"/>
      <circle cx="256" cy="256" r="172" fill="none" stroke="#1e2332" stroke-width="4"/>
      <circle cx="256" cy="256" r="14" fill="#4a8ff7"/>
      <line x1="256" y1="256" x2="256" y2="100" stroke="#f0f2f7" stroke-width="12" stroke-linecap="round"/>
      <line x1="256" y1="256" x2="336" y2="300" stroke="#4a8ff7" stroke-width="14" stroke-linecap="round"/>
      <circle cx="256" cy="66" r="10" fill="#4a8ff7"/>
      <circle cx="256" cy="446" r="10" fill="#4a8ff7"/>
      <circle cx="446" cy="256" r="10" fill="#4a8ff7"/>
      <circle cx="66" cy="256" r="10" fill="#4a8ff7"/>
      <text x="256" y="360" text-anchor="middle" font-family="monospace" font-size="72" font-weight="600" fill="#f0f2f7" letter-spacing="4">UPSC</text>
    </svg>
    <span class="app-title">UPSC Timer</span>
  </div>
  <div style="display:flex;gap:8px;">
    <button class="settings-btn" id="muteBtn" onclick="toggleMute()">🔔 Sound on</button>
    <button class="settings-btn" onclick="toggleSettings()">⚙ Customise</button>
  </div>
</header>

<div class="main">

  <div class="preset-row" id="presetRow"></div>

  <div class="settings-panel" id="settingsPanel">
    <h3>Customise</h3>

    <div class="setting-row">
      <label>Total time</label>
      <input type="number" id="inp-total" min="1" max="60" value="7" style="width:56px">
      <span class="unit">min</span>
      <input type="number" id="inp-total-sec" min="0" max="59" value="30" style="width:56px">
      <span class="unit">sec</span>
    </div>

    <div class="divider"></div>

    <div style="font-size:12px;color:var(--hint);margin-bottom:0.5rem;">Nudge times (from start)</div>

    <div class="setting-row">
      <label>Nudge 1</label>
      <input type="number" id="inp-n1-min" min="0" max="59" value="2" style="width:56px">
      <span class="unit">min</span>
      <input type="number" id="inp-n1-sec" min="0" max="59" value="30" style="width:56px">
      <span class="unit">sec</span>
    </div>

    <div class="setting-row">
      <label>Nudge 2</label>
      <input type="number" id="inp-n2-min" min="0" max="59" value="5" style="width:56px">
      <span class="unit">min</span>
      <input type="number" id="inp-n2-sec" min="0" max="59" value="0" style="width:56px">
      <span class="unit">sec</span>
    </div>

    <div class="divider"></div>

    <div style="font-size:12px;color:var(--hint);margin-bottom:0.5rem;">Phase labels</div>
    <div class="setting-row">
      <label>Phase 1</label>
      <input type="text" id="inp-ph1" value="Intro + structure">
    </div>
    <div class="setting-row">
      <label>Phase 2</label>
      <input type="text" id="inp-ph2" value="Main body">
    </div>
    <div class="setting-row">
      <label>Phase 3</label>
      <input type="text" id="inp-ph3" value="Conclusion + review">
    </div>

    <div class="divider"></div>

    <div style="font-size:12px;color:var(--hint);margin-bottom:0.5rem;">Save as preset</div>
    <div class="setting-row">
      <label>Name</label>
      <input type="text" id="inp-preset-name" value="Custom" style="flex:1">
    </div>

    <button class="apply-btn" onclick="applyAndSave()">Apply & save preset</button>
  </div>

  <div class="timer-card">
    <div class="timer-display" id="disp">7:30</div>
    <div class="phase-label" id="phaselbl">Ready — select a preset and start</div>

    <div class="progress-track">
      <div class="progress-fill" id="bar" style="width:100%;background:var(--phase1);"></div>
    </div>
    <div class="nudge-markers" id="nudgeMarkers"></div>

    <div class="phase-pills" id="phasePills"></div>

    <div class="nudge-alert" id="nudgeAlert"></div>

    <div class="controls">
      <button class="btn-primary" id="startBtn" onclick="toggleTimer()">Start</button>
      <button class="btn-secondary" onclick="resetTimer()">Reset</button>
    </div>
  </div>



</div>


<audio id="nudgeSound" preload="auto">
  <source src="nudge.mp3" type="audio/mpeg">
</audio>
<audio id="actionSound" preload="auto">
  <source src="starting-sound.mp3" type="audio/mpeg">
</audio>

<script>

const nudgeSound = document.getElementById('nudgeSound');
const actionSound = document.getElementById('actionSound');
let audioUnlocked = false;

function unlockAudio(){
  if(audioUnlocked) return;
  actionSound.volume = 0;
  actionSound.play().then(()=>{
    actionSound.pause();
    actionSound.currentTime = 0;
    actionSound.volume = 1;
    audioUnlocked = true;
  }).catch(()=>{});
}

function playNudgeSound(){
  nudgeSound.currentTime = 0;
  nudgeSound.play().catch(()=>{});
}

function playActionSound(){
  actionSound.currentTime = 0;
  actionSound.play().catch(()=>{});
}

const DEFAULT_PRESETS = [
  {
    name: "10M",
    label: "10 marks",
    total: 450,
    nudges: [150, 300],
    phases: ["Intro + structure", "Main body", "Conclusion + review"],
    nudgeMsgs: ["Move to main body", "Start conclusion now"]
  },
  {
    name: "15M",
    label: "15 marks",
    total: 600,
    nudges: [180, 390],
    phases: ["Intro + structure", "Main body", "Conclusion + review"],
    nudgeMsgs: ["Move to main body", "Start conclusion now"]
  },
  {
    name: "20M",
    label: "20 marks",
    total: 900,
    nudges: [240, 600],
    phases: ["Intro + structure", "Main body", "Conclusion + review"],
    nudgeMsgs: ["Move to main body", "Start conclusion now"]
  }
];

let presets = JSON.parse(localStorage.getItem('upsc_presets') || 'null') || DEFAULT_PRESETS;
let activePresetIdx = 0;
let elapsed = 0, running = false, interval = null;

function playNudgeSound() {
  if (soundMuted) return;
  try { playNudgeSound(); } catch(e) {}
}

function playFinishSound() {
  if (soundMuted) return;
  try { playActionSound(); } catch(e) {}
}

function toggleMute() {
  soundMuted = !soundMuted;
  document.getElementById('muteBtn').textContent = soundMuted ? '🔇 Muted' : '🔔 Sound on';
  document.getElementById('muteBtn').style.color = soundMuted ? 'var(--hint)' : 'var(--muted)';
}

function getPreset() { return presets[activePresetIdx]; }

function fmt(s) {
  s = Math.max(0, Math.round(s));
  let m = Math.floor(s/60), sec = s%60;
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

function getPhase(e) {
  const p = getPreset();
  if (e < p.nudges[0]) return 0;
  if (e < p.nudges[1]) return 1;
  return 2;
}

const phaseColors = ['var(--phase1)', 'var(--phase2)', 'var(--phase3)'];
const phaseColorHex = ['#4a8ff7', '#3ecf8e', '#f5a524'];

function renderPresets() {
  const row = document.getElementById('presetRow');
  row.innerHTML = '';
  presets.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.className = 'preset-btn' + (i === activePresetIdx ? ' active' : '');
    btn.innerHTML = `<div>${p.label || p.name}</div><div class="pb-marks">${fmt(p.total)}</div>`;
    btn.onclick = () => { activePresetIdx = i; resetTimer(); renderPresets(); renderPhases(); };
    row.appendChild(btn);
  });
}

function renderPhases() {
  const p = getPreset();
  const pills = document.getElementById('phasePills');
  pills.innerHTML = '';
  const boundaries = [0, p.nudges[0], p.nudges[1], p.total];
  p.phases.forEach((ph, i) => {
    const div = document.createElement('div');
    div.className = 'phase-pill';
    div.id = 'pill-' + i;
    div.style.setProperty('--phase-color', phaseColors[i]);
    div.innerHTML = `<div class="pp-time">${fmt(boundaries[i])}–${fmt(boundaries[i+1])}</div><div class="pp-label">${ph}</div>`;
    pills.appendChild(div);
  });

  const markers = document.getElementById('nudgeMarkers');
  markers.innerHTML = '';
  p.nudges.forEach((n, i) => {
    const pct = (n / p.total) * 100;
    const mk = document.createElement('div');
    mk.className = 'nudge-mark';
    mk.id = 'nudge-mark-' + i;
    mk.style.left = pct + '%';
    mk.innerHTML = `<div class="nudge-mark-line"></div><div class="nudge-mark-label">${fmt(n)}</div>`;
    markers.appendChild(mk);
  });
}

function render() {
  const p = getPreset();
  const remaining = Math.max(0, p.total - elapsed);
  document.getElementById('disp').textContent = fmt(remaining);

  const phase = getPhase(elapsed);
  const colors = ['var(--phase1)', 'var(--phase2)', 'var(--phase3)'];
  document.getElementById('disp').style.color = (running || elapsed > 0) ? phaseColorHex[phase] : 'var(--text)';

  const pct = (elapsed / p.total) * 100;
  const bar = document.getElementById('bar');
  bar.style.width = (100 - pct) + '%';
  bar.style.background = colors[phase];

  for (let i = 0; i < 3; i++) {
    const pill = document.getElementById('pill-' + i);
    if (!pill) continue;
    pill.className = 'phase-pill';
    pill.style.setProperty('--phase-color', colors[i]);
    if (i === phase && (running || elapsed > 0)) pill.classList.add('active');
    if (i < phase) pill.classList.add('done');
  }

  if (running || elapsed > 0) {
    const labels = ['Phase 1 — ' + p.phases[0], 'Phase 2 — ' + p.phases[1], 'Phase 3 — ' + p.phases[2]];
    document.getElementById('phaselbl').textContent = labels[phase];
  }
}

function checkNudges() {
  const p = getPreset();
  p.nudges.forEach((n, i) => {
    if (elapsed >= n && !nudgedAt[i]) {
      nudgedAt[i] = true;
      const alert = document.getElementById('nudgeAlert');
      alert.textContent = p.nudgeMsgs[i] || ('Nudge ' + (i+1));
      alert.className = 'nudge-alert show';
      alert.style.borderColor = 'var(--accent-amber)';
      alert.style.color = 'var(--accent-amber)';
      const mk = document.getElementById('nudge-mark-' + i);
      if (mk) mk.classList.add('triggered');
      playNudgeSound();
      try { navigator.vibrate && navigator.vibrate([80, 40, 80]); } catch(e) {}
    }
  });
}

function tick() {
  elapsed++;
  render();
  checkNudges();
  const p = getPreset();
  if (elapsed >= p.total) {
    clearInterval(interval);
    running = false;
    document.getElementById('startBtn').textContent = 'Start';
    document.getElementById('phaselbl').textContent = 'Time is up — pen down';
    document.getElementById('disp').style.color = 'var(--accent-green)';
    const alert = document.getElementById('nudgeAlert');
    alert.textContent = 'Done! ' + fmt(p.total) + ' complete. Pen down.';
    alert.className = 'nudge-alert show done';
    playFinishSound();
    try { navigator.vibrate && navigator.vibrate([150, 80, 150, 80, 300]); } catch(e) {}
  }
}

function toggleTimer(){
unlockAudio();
playActionSound();
  const p = getPreset();
  if (running) {
    clearInterval(interval);
    running = false;
    document.getElementById('startBtn').textContent = 'Resume';
    document.getElementById('phaselbl').textContent = 'Paused';
  } else {
    if (elapsed >= p.total) return;
    running = true;
    document.getElementById('startBtn').textContent = 'Pause';
    if (elapsed === 0) document.getElementById('phaselbl').textContent = 'Phase 1 — ' + p.phases[0];
    interval = setInterval(tick, 1000);
  }
}

function resetTimer() {
  clearInterval(interval);
  running = false; elapsed = 0; nudgedAt = {};
  document.getElementById('startBtn').textContent = 'Start';
  document.getElementById('nudgeAlert').className = 'nudge-alert';
  document.getElementById('phaselbl').textContent = 'Ready — select a preset and start';
  document.getElementById('disp').style.color = 'var(--text)';
  document.querySelectorAll('.nudge-mark').forEach(m => m.classList.remove('triggered'));
  render();
}

function toggleSettings() {
  const p = document.getElementById('settingsPanel');
  p.classList.toggle('open');
  if (p.classList.contains('open')) loadSettingsFromPreset();
}

function loadSettingsFromPreset() {
  const p = getPreset();
  const tm = Math.floor(p.total / 60), ts = p.total % 60;
  document.getElementById('inp-total').value = tm;
  document.getElementById('inp-total-sec').value = ts;
  const n1m = Math.floor(p.nudges[0]/60), n1s = p.nudges[0]%60;
  document.getElementById('inp-n1-min').value = n1m;
  document.getElementById('inp-n1-sec').value = n1s;
  const n2m = Math.floor(p.nudges[1]/60), n2s = p.nudges[1]%60;
  document.getElementById('inp-n2-min').value = n2m;
  document.getElementById('inp-n2-sec').value = n2s;
  document.getElementById('inp-ph1').value = p.phases[0];
  document.getElementById('inp-ph2').value = p.phases[1];
  document.getElementById('inp-ph3').value = p.phases[2];
  document.getElementById('inp-preset-name').value = p.label || p.name;
}

function applyAndSave() {
  const total = parseInt(document.getElementById('inp-total').value)*60 + parseInt(document.getElementById('inp-total-sec').value);
  const n1 = parseInt(document.getElementById('inp-n1-min').value)*60 + parseInt(document.getElementById('inp-n1-sec').value);
  const n2 = parseInt(document.getElementById('inp-n2-min').value)*60 + parseInt(document.getElementById('inp-n2-sec').value);
  const ph1 = document.getElementById('inp-ph1').value || 'Phase 1';
  const ph2 = document.getElementById('inp-ph2').value || 'Phase 2';
  const ph3 = document.getElementById('inp-ph3').value || 'Phase 3';
  const name = document.getElementById('inp-preset-name').value || 'Custom';

  if (total <= 0 || n1 <= 0 || n2 <= n1 || n2 >= total) {
    alert('Check your times: Nudge 1 < Nudge 2 < Total time');
    return;
  }

  const newPreset = {
    name: name.substring(0,6),
    label: name,
    total,
    nudges: [n1, n2],
    phases: [ph1, ph2, ph3],
    nudgeMsgs: ['Move to ' + ph2, 'Start ' + ph3 + ' now']
  };

  const existing = presets.findIndex(p => p.label === name);
  if (existing >= 0) {
    presets[existing] = newPreset;
    activePresetIdx = existing;
  } else {
    presets.push(newPreset);
    activePresetIdx = presets.length - 1;
  }

  localStorage.setItem('upsc_presets', JSON.stringify(presets));
  document.getElementById('settingsPanel').classList.remove('open');
  resetTimer();
  renderPresets();
  renderPhases();
}

renderPresets();
renderPhases();
render();
</script>
</body>
</html>
